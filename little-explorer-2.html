<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Munzir's Little Explorer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#23325a;--pop:#ff6b6b;--sun:#ffd93d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9fdcff;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
button:disabled{opacity:.5}
#card{position:fixed;top:150px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);border:4px solid var(--sun);border-radius:24px;padding:6px 12px 6px 44px;display:flex;align-items:center;gap:10px;max-width:94vw;animation:pop .3s}
#card .big{font-size:2.3rem;font-weight:900;color:var(--pop)}#card .pic{font-size:2.2rem}#card .w{font-size:1.1rem;font-weight:800}#card .btn{min-height:44px;padding:6px 12px}
#hero{position:absolute;top:max(96px,15vh);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;color:#fff;font-size:1.4rem;text-shadow:0 2px 0 #23325a}
#hero img{width:92px;height:92px;border-radius:50%;border:5px solid #ffd93d;object-fit:cover;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){#hero img{animation:none}}
#card .face{position:absolute;top:-28px;left:-20px;width:62px;height:62px;border-radius:50%;border:4px solid #ffd93d;object-fit:cover;background:#fff}
.btn{border:0;border-radius:26px;background:var(--sun);color:var(--ink);font:inherit;font-weight:800;font-size:1.25rem;padding:14px 22px;min-height:56px;box-shadow:0 5px 0 #c9a200;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9a200}
.btn.big{font-size:1.9rem;background:var(--pop);color:#fff;box-shadow:0 6px 0 #b83b3b;padding:16px 44px}
.btn.alt{background:#fff;box-shadow:0 5px 0 #b9c6d8}
#home,#pause,#parent,#levels,#done{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:16px 16px 28px;text-align:center}
#pause,#parent,#levels,#done{justify-content:center;background:rgba(35,50,90,.6);color:#fff}
h1{margin:0;font-size:clamp(2.2rem,9vw,4rem);color:#fff;text-shadow:0 4px 0 #ff6b6b,0 8px 12px rgba(0,0,0,.25);position:absolute;top:5vh;left:0;right:0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}.sec{font-size:1.4rem;padding:14px 8px;min-height:64px}
#cap{z-index:6}
#mg{position:fixed;inset:0;z-index:4;background:linear-gradient(#9fdcff,#ffe8a3);display:flex;flex-direction:column}#mgTop{display:flex;gap:10px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 10px 6px}#mgHud{background:#fff;border-radius:22px;padding:10px 16px;font-weight:800;font-size:1.3rem}#mgArea{flex:1;position:relative;overflow:hidden}
.mgq{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:10px 18px;font-weight:800;font-size:1.2rem;text-align:center;box-shadow:0 4px 0 #b9c6d8;z-index:2;width:max-content;max-width:92vw}
.gm{display:flex;flex-direction:column;gap:16px;align-items:center}.gm .btn{width:84%;max-width:360px;font-size:1.6rem;color:#fff}
#mgOver{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:rgba(35,50,90,.6);padding:16px}
.bal{position:absolute;bottom:-120px;width:72px;height:90px;animation:rise linear forwards;touch-action:manipulation}.bal i{display:block;width:100%;height:100%;border-radius:50% 50% 46% 46%;border:3px solid rgba(255,255,255,.7);box-shadow:inset -8px -8px 0 rgba(0,0,0,.12);transition:.25s}@keyframes rise{to{transform:translateY(-130vh)}}
.holes{display:grid;grid-template-columns:repeat(3,min(28vw,110px));gap:14px;justify-content:center;margin-top:90px}.hole{height:min(28vw,110px);border-radius:50%;background:#5b3a1e;box-shadow:inset 0 8px 0 #3b2412;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:3rem}.hole>*{transform:translateY(120%);transition:.15s;width:100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center}.hole.up>*{transform:none}
.cards{display:grid;grid-template-columns:repeat(3,min(26vw,100px));gap:12px;justify-content:center;margin-top:90px}.card{height:min(26vw,100px);position:relative;perspective:400px}.card span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;border-radius:18px;backface-visibility:hidden;transition:transform .3s}.card .b{background:#ffd93d;box-shadow:0 4px 0 #c9a200}.card .f{background:#fff;transform:rotateY(180deg)}.card.on .b{transform:rotateY(180deg)}.card.on .f{transform:none}.card img{width:100%;height:100%;border-radius:18px;object-fit:cover}
.dots button{width:44px;height:44px;border-radius:50%;border:4px solid #fff;cursor:pointer}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#hud .btn{pointer-events:auto;padding:8px 14px;min-height:48px;font-size:1.2rem}
#stars{background:#fff;border-radius:22px;padding:10px 16px;font-weight:800;font-size:1.3rem;margin-right:auto}
#prompt{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#fff;border-radius:22px;padding:10px 18px;font-weight:800;font-size:1.3rem;max-width:92vw;text-align:center;box-shadow:0 4px 0 #b9c6d8}
#cap{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(35,50,90,.85);color:#fff;border-radius:16px;padding:8px 16px;font-size:1.1rem;max-width:92vw;text-align:center}
@keyframes pop{from{transform:translateX(-50%) scale(.5)}to{transform:translateX(-50%) scale(1)}}
#steer{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}
#steer button{pointer-events:auto;width:92px;height:84px;border-radius:30px;border:0;background:rgba(255,255,255,.9);font-size:2.6rem;box-shadow:0 5px 0 #b9c6d8;touch-action:none}
#steer button.on{background:var(--sun)}
.panel{background:#fff;color:var(--ink);border-radius:24px;padding:18px;max-width:560px;width:100%;max-height:78vh;overflow:auto;text-align:left;line-height:1.5}
.panel input{font:inherit;font-size:1.3rem;width:90px;padding:8px;border-radius:12px;border:3px solid #b9c6d8}
#oops{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:#fff;border:5px solid #4d96ff;border-radius:28px;padding:14px 20px;text-align:center;font-weight:900;font-size:1.5rem;max-width:90vw;z-index:5;pointer-events:none;animation:wob .5s}
@keyframes wob{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-58%)}75%{transform:translateX(-42%)}}
.cry{position:relative;width:120px;height:120px;margin:0 auto 6px}.cry img{width:120px;height:120px;border-radius:50%;border:5px solid #4d96ff;object-fit:cover;filter:saturate(.7)}
.tear{position:absolute;font-size:1.7rem;animation:drip 1s infinite}.t1{left:26px;top:70px}.t2{left:62px;top:60px;animation-delay:.45s}.sob{position:absolute;right:-14px;bottom:-8px;font-size:2.4rem}
.t3{left:34px;top:78px;animation-delay:.15s}.t4{left:70px;top:66px;animation-delay:.7s}.cry img{animation:sob .3s infinite alternate}@keyframes sob{from{transform:rotate(-4deg)}to{transform:rotate(4deg) scale(1.06)}}
@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(46px);opacity:0}}
#pop{position:fixed;top:36%;left:0;right:0;text-align:center;font-size:2.8rem;font-weight:900;color:#fff;text-shadow:0 4px 0 #ff6b6b,0 0 18px #ffd93d;pointer-events:none;z-index:5;animation:zoom 1.2s forwards}
@keyframes zoom{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:translateY(-60px);opacity:0}}
.champ{width:120px;height:120px;border-radius:50%;border:5px solid #ffd93d;object-fit:cover;animation:bob 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tear,#pop,.champ,#oops,.cry img{animation:none}}</style></head><body>
<canvas id="c"></canvas>

<div id="home">
  <h1>🚗 Little Explorer</h1>
  <div id="hero"></div>
  <div class="row dots" id="dots"></div>
  <div class="grid"><button class="btn sec" id="sABC" style="background:#ff6b6b;color:#fff;box-shadow:0 5px 0 #b83b3b">🔤 Letters</button><button class="btn sec" id="sNUM" style="background:#4d96ff;color:#fff;box-shadow:0 5px 0 #2a63bd">🔢 Numbers</button><button class="btn sec" id="sSHP" style="background:#2fbf4a;color:#fff;box-shadow:0 5px 0 #1f8a33">🔷 Shapes</button><button class="btn sec" id="sCOL" style="background:#9b4dff;color:#fff;box-shadow:0 5px 0 #6c2fc0">🎨 Colors</button></div>
  <div class="row"><button class="btn alt" id="bLev">📚 Levels</button><button class="btn alt" id="bFree">⭐ Free</button><button class="btn alt" id="bGames">🎮 Games</button></div>
  <div class="row">
    <button class="btn alt" id="bSnd">🔊 Sound</button>
    <button class="btn alt" id="bPar">👨‍👩‍👧 Parents</button>
  </div>
</div>

<div id="hud" class="hide">
  <button class="btn alt" id="bHome">🏠</button>
  <div id="stars">⭐ 0</div>
  <button class="btn alt" id="bSay">🔊</button>
  <button class="btn alt" id="bPause">⏸</button>
</div>
<div id="prompt" class="hide"></div>
<div id="card" class="hide"></div>
<div id="cap" class="hide"></div>
<div id="oops" class="hide"></div>
<div id="pop" class="hide"></div>
<div id="mg" class="hide"><div id="mgTop"><button class="btn alt" id="mgBack">⬅</button><div id="mgHud"></div></div><div id="mgArea"></div></div>
<div id="mgOver" class="hide"><div class="panel" style="text-align:center"><h2 id="mgOT" style="font-size:1.8rem;margin:0 0 12px"></h2><div class="row"><button class="btn big" id="mgAgain">↻ Again</button><button class="btn alt" id="mgBk">🎮 Games</button></div></div></div>
<div id="steer" class="hide"><button id="bL" aria-label="Steer left">◀</button><button id="bR" aria-label="Steer right">▶</button></div>

<div id="pause" class="hide"><h2 style="font-size:2.4rem;margin:0">Paused</h2><button class="btn big" id="bRes">Keep exploring</button></div>
<div id="levels" class="hide"><div class="panel" id="lbody" style="text-align:center"></div></div>
<div id="done" class="hide"><div class="panel" style="text-align:center"><h2 id="doneT" style="font-size:2rem;margin:0 0 12px"></h2><div class="row"><button class="btn big" id="nextB">Next level ▶</button><button class="btn alt" id="againB">↻ Again</button><button class="btn alt" id="menuB">📚 Levels</button></div></div></div>
<div id="parent" class="hide"><div class="panel" id="pbody"></div></div>

  mgT=setInterval(()=>{if(!mgOn)return;tick++;if(tick%10===0){tl--;q()}
    if(tick%7===0){const e=H.filter(h=>!h.dataset.k),h=rnd(e);if(h){const bomb=Math.random()<.22;h.dataset.k=bomb?'b':'f';
      h.innerHTML=bomb?'<b>💣</b>':save.photo?`<img src="${save.photo}">`:'<b>😄</b>';h.classList.add('up');clearTimeout(h._t);h._t=setTimeout(()=>{delete h.dataset.k;h.classList.remove('up')},1300)}}
    if(tl<=0)mgEnd(true,`Time's up! You got ${mgScore}!`)},100)}
function memory(){
  const E=['🐶','🐱','🦁','🐘','🚗','PHOTO'],deck=[...E,...E].sort(()=>Math.random()-.5);
  ar.innerHTML='<div class="mgq">Find the pairs! 🧩</div><div class="cards" id="cs"></div>';let first=null,lock=false,found=0,tries=0;
  deck.forEach(v=>{const c=document.createElement('div');c.className='card';c.dataset.v=v;
    c.innerHTML=`<span class="f">${v==='PHOTO'?(save.photo?`<img src="${save.photo}">`:'😄'):v}</span><span class="b">❓</span>`;
    c.onpointerdown=()=>{if(!mgOn||lock||c.classList.contains('on'))return;c.classList.add('on');beep(600);if(!first){first=c;return}tries++;
      if(first.dataset.v===v){found++;mgScore++;save.stars++;beep(880);mgHud();first=null;if(found===6)mgEnd(true,`You found them all in ${tries} tries!`)}
      else{lock=true;const a=first;first=null;setTimeout(()=>{a.classList.remove('on');c.classList.remove('on');lock=false},800)}};
    ar.querySelector('#cs').appendChild(c)})}
$('bGames').onclick=()=>{mg.classList.remove('hide');mgMenu();say(`Pick a game${nm()}!`)};
$('mgBack').onclick=()=>{$('mgOver').classList.add('hide');$('oops').classList.add('hide');mgKind?mgMenu():closeMG()};
$('mgAgain').onclick=()=>startMG(mgKind);$('mgBk').onclick=()=>{$('mgOver').classList.add('hide');mgMenu()};
// parents
$('bPar').onclick=()=>{
  const a=2+Math.floor(Math.random()*6),b=2+Math.floor(Math.random()*6);
  $('parent').classList.remove('hide');
  $('pbody').innerHTML=`<h2 style="margin-top:0">Grown-ups only</h2><p>What is ${a} + ${b}? <input id="ans" inputmode="numeric"> <button class="btn" id="ok">Enter</button> <button class="btn alt" id="x">Close</button></p>`;
  $('x').onclick=()=>$('parent').classList.add('hide');
  $('ok').onclick=()=>{if(+$('ans').value===a+b)dash();else $('ans').value=''};
};
function dash(){
  const keys=o=>Object.keys(o).sort((x,y)=>isNaN(x)?x.localeCompare(y):x-y).join(' ')||'none yet';
  const need=Object.entries(save.miss).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0]).join(', ')||'nothing flagged yet';
  const names={abc:'Letters',num:'Numbers',shape:'Shapes',color:'Colors',free:'Free Drive'};
  $('pbody').innerHTML=`<h2 style="margin-top:0">Parent dashboard</h2>
  <p><b>Worlds visited:</b> ${Object.keys(save.worlds).map(k=>names[k]).join(', ')||'none yet'}<br>
  <b>Levels completed:</b> ${Object.keys(save.cl).length}<br><b>Activities completed:</b> ${save.acts}<br><b>Stars:</b> ${save.stars}<br>
  <b>Session time:</b> ${Math.round((Date.now()-t0)/60000)} min<br>
  <b>Letters seen (participation):</b> ${keys(save.seen)}<br>
  <b>Letters found correctly:</b> ${keys(save.known)}<br>
  <b>Numbers found correctly:</b> ${keys(save.nknown)}<br>
  <b>Shapes and colors found:</b> ${keys(save.sc||{})}<br>
  <b>May need more practice:</b> ${need}</p>
  <p class="row"><button class="btn alt" id="sd">${save.sound?'🔊 Sound on':'🔇 Sound off'}</button>
  <button class="btn alt" id="rs">Reset progress</button><button class="btn" id="x">Close</button></p>
  <p><b>Child's name:</b> <input id="nm" style="width:160px" maxlength="20" value="${save.name||''}"><br><b>Say it like:</b> <input id="sy" style="width:160px" maxlength="24" value="${save.say||''}"> <button class="btn alt" id="sv">Save</button></p>
  <p><label class="btn alt" style="display:inline-block">📷 Add child's photo<input id="ph" type="file" accept="image/*" hidden></label> <button class="btn alt" id="rm">Remove photo</button></p>
  <small>Name and photo are kept only on this device. Nothing is uploaded or shared.</small>`;
  $('x').onclick=()=>$('parent').classList.add('hide');
  $('sd').onclick=()=>{save.sound=!save.sound;snd();persist();dash()};
  $('sv').onclick=()=>{save.name=$('nm').value.trim().slice(0,20);save.say=$('sy').value.trim().slice(0,24);persist();applyHero()};
  $('ph').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)*.3,s,s,0,0,256,256);save.photo=c.toDataURL('image/jpeg',.82);save.noPhoto=0;persist();applyHero();URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
  $('rm').onclick=()=>{save.photo='';save.noPhoto=1;persist();applyHero()};
  $('rs').onclick=()=>{if(confirm('Reset all progress?')){save=Object.assign({},def,{name:save.name,photo:save.photo,cl:{},seen:{},known:{},nseen:{},nknown:{},miss:{},worlds:{},sc:{}});persist();hud();dash()}};
}
let driver=null,signs=[];
function applyHero(){
  signs.forEach(x=>x.parent&&x.parent.remove(x));signs=[];
  $('hero').innerHTML=(save.photo?`<img src="${save.photo}" alt="">`:'')+`<div>Let's go${nm()}!</div>`;
  if(driver){car.remove(driver);driver.material.map.dispose();driver.material.dispose();driver=null}
  if(!save.photo)return;
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#ffd93d';x.beginPath();x.arc(128,128,126,0,7);x.fill();x.save();x.beginPath();x.arc(128,128,112,0,7);x.clip();x.drawImage(im,16,16,224,224);x.restore();
    if(driver){car.remove(driver)}
    driver=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));driver.scale.set(1.3,1.3,1);driver.position.set(0,1.8,1.4);car.add(driver);const tx=driver.material.map;for(let k=0;k<26;k+=3){if(k%5===4)continue;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx}));sp.scale.set(2.4,2.4,1);sp.position.y=5.6;deco[k].add(sp);signs.push(sp)}};
  im.src=save.photo;
}
// tap a letter or number in the 3D scene to hear it
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||paused)return;
  pt.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(pt,cam);
  const hit=ray.intersectObjects(items.map(g=>g.userData.s))[0];if(!hit)return;
  const u=hit.object.parent.userData;if(u.kind==='star'||u.taken)return;
  speak(/^\d+$/.test(u.lab)||u.lab.length>1?u.lab:LN[u.lab.charCodeAt(0)-65]);
});
// controls
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=1;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=1;if(e.code==='Escape'&&state==='play')setPause(!paused)});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=0;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=0});
addEventListener('blur',()=>{keys.l=keys.r=0});
for(const [id,k] of [['bL','l'],['bR','r']]){const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;b.classList.add('on')});
  for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{keys[k]=0;b.classList.remove('on')});
}
// ---------- loop ----------
let prev=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-prev)/1000,.05);prev=now;time+=dt;
  if(state==='home'){
    car.rotation.y+=dt*.8;car.position.y=Math.sin(time*2)*.08;
    cam.position.set(0,3,8.5);cam.lookAt(0,1,0);
  }else if(!paused){
    speed+=(7+Math.min(qDone,6)*.7-speed)*Math.min(1,dt*1.5);z-=speed*dt;
    vx+=((keys.r-keys.l)*6-vx)*Math.min(1,dt*6);carX=Math.max(-4.6,Math.min(4.6,carX+vx*dt));
    car.position.set(carX,0,z);car.rotation.y=-vx*.05;
    cam.position.set(carX*.6,4.2,z+8.5);if(shake>0){shake-=dt;cam.position.x+=(Math.random()-.5)*shake*2;cam.position.y+=(Math.random()-.5)*shake}cam.lookAt(carX*.5,1,z-7);
    spawn();
    for(const g of items.slice()){
      const u=g.userData;
      if(u.taken){u.taken+=dt*3;g.scale.setScalar(1+u.taken);u.s.material.opacity=Math.max(0,1-u.taken);if(u.taken>1)removeItem(g);continue}
      u.s.position.y=u.base+Math.sin(time*3+g.position.x)*.2;
      if(Math.abs(g.position.z-z)<1.4&&Math.abs(g.position.x-carX)<1.7)collect(g);
      else if(g.position.z>z+12)removeItem(g);
    }
  }
  rb.position.set(carX*.2,0,z-110);ground.position.z=z;ground.position.x=carX;road.position.z=z;rt.offset.y=-z/5;
  for(const d of deco)if(d.position.z>z+15)d.position.z-=156;
  for(const p of parts.slice()){p.life-=dt;p.v.y-=9*dt;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=Math.max(0,p.life);if(p.life<=0){scene.remove(p.m);p.m.material.dispose();parts.splice(parts.indexOf(p),1)}}
  renderer.render(scene,cam);
}
addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')setPause(true)});
hud();
if(!('speechSynthesis' in window))say('Sound is not supported here. Try Chrome or Safari.');
applyHero();
requestAnimationFrame(frame);
})();
</script>
